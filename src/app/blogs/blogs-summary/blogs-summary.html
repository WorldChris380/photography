<section class="blogs-summary">
  <div class="summary-overlay"></div>
  <div class="summary-grid"></div>
  <div class="summary-content">
    <div class="summary-card">
      <h1 class="summary-title">
        <span class="title-line shimmer">{{ titleLine1 }}</span>
        <span class="title-line shimmer">{{ titleLine2 }}</span>
      </h1>
      <p class="summary-subtitle">{{ subtitle }}</p>

      <div class="summary-stats">
        <div class="stat">
          <span class="stat-number">{{ animatedPosts }}</span>
          <span class="stat-label">Articles</span>
        </div>
        <div class="stat">
          <span class="stat-number">{{ animatedCategories }}</span>
          <span class="stat-label">Categories</span>
        </div>
        <div class="stat">
          <span class="stat-number">∞</span>
          <span class="stat-label">Adventures</span>
        </div>
      </div>
    </div>
  </div>
</section>
