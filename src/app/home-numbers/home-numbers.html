<div id="facts-content-limitation">
  <div class="facts-row">
    <a class="fact-box" [routerLink]="['/gallery']" [queryParams]="{ filter: 'Aviation' }" aria-label="Aviation gallery">
      <div class="fact-number count-animated">{{ photosInDatabaseStart | number:'1.0-0':'de' }}</div>
      <div class="fact-label">Photos in database</div>
    </a>

     <a class="fact-box" [routerLink]="['/gallery']" [queryParams]="{ filter: 'Aviation' }" aria-label="Aviation gallery">
      <div class="fact-number count-animated">{{ aviationDisplay }}</div>
      <div class="fact-label">Aviation Photos presented</div>
    </a>

    <a class="fact-box" [routerLink]="['/gallery']" [queryParams]="{ filter: 'Travel' }" aria-label="Travel gallery">
      <div class="fact-number count-animated">{{ travelDisplay }}</div>
      <div class="fact-label">Travel Photos presented</div>
    </a>

    <a class="fact-box" href="#" (click)="scrollTo('countries-visited', $event)" aria-label="Countries presented">
      <div class="fact-number count-animated">{{ countriesPresentedDisplay }}</div>
      <div class="fact-label">Countries presented</div>
    </a>

    <a class="fact-box" href="#" (click)="scrollTo('countries-visited', $event)" aria-label="Countries visited">
      <div class="fact-number count-animated">{{ countriesVisitedDisplay }}</div>
      <div class="fact-label">Countries visited</div>
    </a>
  </div>
</div>
